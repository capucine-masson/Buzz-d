<!DOCTYPE html>
<html lang="fr"{% if request.query_params.get('embedded') %} class="is-embedded"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Buzz'd{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bahiana&family=Bellota+Text:ital,wght@0,400;0,700;1,400&family=Anonymous+Pro:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version('css/style.css') }}">
</head>
<body>
    <a href="/" class="icon-button icon-button--home" aria-label="Retour à l'accueil">
        <img src="/static/css/logo%20BUZZ'D.jpg" alt="" class="icon-button__logo">
    </a>
    <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Changer de thème">
        <svg id="theme-toggle-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>
    {% block content %}{% endblock %}
    <script src="/static/js/theme.js?v={{ asset_version('js/theme.js') }}"></script>
    <script src="/static/js/flash.js?v={{ asset_version('js/flash.js') }}"></script>
</body>
</html>
