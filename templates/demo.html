{% extends "base.html" %}

{% block title %}Démo {{ room.code }} — Buzz'd{% endblock %}

{% block content %}
<main class="page page--demo">
    {% if not players %}
    <p class="note note--error">Aucun joueur dans cette room pour l'instant.</p>
    {% endif %}

    <div class="phone-grid" id="phone-grid">
        {% for p in players %}
        <div class="phone-frame">
            <span class="phone-frame__label">{{ p.nickname }}</span>
            <div class="phone-frame__notch" aria-hidden="true"></div>
            <iframe class="phone-frame__screen"
                    src="/room/{{ room.code }}?player={{ p.nickname }}&embedded=1"
                    loading="lazy"
                    title="Écran de {{ p.nickname }}"></iframe>
        </div>
        {% endfor %}
        <button type="button" class="phone-add-button" id="phone-add-button" aria-label="Ajouter un téléphone">+</button>
    </div>
</main>
<script src="/static/js/demo.js?v={{ asset_version('js/demo.js') }}"></script>
{% endblock %}
